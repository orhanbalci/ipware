name: Update provider ranges

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch provider ranges
        run: cargo xtask update-ranges

      - name: Test
        run: cargo test --all-features

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-provider-ranges
          delete-branch: true
          commit-message: "chore: update provider IP ranges"
          title: "chore: update provider IP ranges"
          body: |
            Generated by `cargo xtask update-ranges`.

            Review the changed ranges in `src/providers/data.rs` before merging.
