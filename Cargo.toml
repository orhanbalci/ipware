[package]
name = "ipware"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Client IP extraction from proxy headers and the TCP peer, with trusted proxy checks"
repository = "https://github.com/orhanbalci/ipware"
homepage = "https://github.com/orhanbalci"
keywords = ["http", "ip", "proxy", "client-ip", "x-forwarded-for"]
license = "MIT"
readme = "README.md"
categories = ["web-programming", "network-programming"]
exclude = [".cargo", ".github", "xtask", "layout.kdl", "rustfmt.toml"]

[features]
default = ["http1"]
# Read headers from `http` 1.x `HeaderMap` (axum 0.7+, hyper 1, reqwest 0.12+)
http1 = ["dep:http"]
# Read headers from `http` 0.2 `HeaderMap` (actix-web 4, hyper 0.14)
http02 = ["dep:http02"]
# Platform presets and published IP ranges of CDNs, load balancers and webhook senders
providers = ["dep:serde_json"]

[dependencies]
http = { version = "1", optional = true }
http02 = { package = "http", version = "0.2.9", optional = true }
ip_rfc = "0.1.0"
ipnet = "2.9"
serde_json = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
spectral = "0.6"

[workspace]
members = ["xtask"]

[[bench]]
name = "ranges"
harness = false
