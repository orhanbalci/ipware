[package]
name = "ipware"
version = "0.4.0"
edition = "2021"
description = "Http Header Client Ip Extraction Utility"
repository = "https://github.com/orhanbalci/ipware.git"
homepage = "https://github.com/orhanbalci"
keywords = ["http","client", "ip", "proxy"]
license = "MIT"
readme = "README.md"
categories = ["web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["http1"]
# Read headers from `http` 1.x `HeaderMap` (axum 0.7+, hyper 1, reqwest 0.12+)
http1 = ["dep:http"]
# Read headers from `http` 0.2 `HeaderMap` (actix-web 4, hyper 0.14)
http02 = ["dep:http02"]

[dependencies]
http = { version = "1", optional = true }
http02 = { package = "http", version = "0.2.9", optional = true }
ip_rfc = "0.1.0"

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
spectral = "0.6"
